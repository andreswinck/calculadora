name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repo
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar y Reparar Gradle Automaticamente
      uses: gradle/actions/setup-gradle@v4

    - name: Forzar Compilacion de Android
      run: |
        if [ -d "calculadora" ]; then
          cd calculadora
        fi
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Mover APK a la raiz
      run: |
        mkdir -p apk-salida
        find . -name "*.apk" -exec cp {} apk-salida/ \;

    - name: Subir APK finalizado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: apk-salida/
