name: Compilar APK

on:
  workflow_dispatch: # Te permite activar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repo
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Dar permisos de ejecucion a Gradle
      run: chmod +x gradlew

    - name: Compilar APK de depuracion (Debug)
      run: ./gradlew assembleDebug

    - name: Subir APK finalizado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
