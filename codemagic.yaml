workflows:
  android-apk-build:
    name: Compilar APK Calculadora
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      android_sdk: latest
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Compilar APK
        script: |
          if [ -d "calculadora" ]; then
            cd calculadora
          fi
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - calculadora/app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/debug/*.apk
