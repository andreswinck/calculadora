workflows:
  android-apk-build:
    name: Compilar APK Calculadora
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Compilar APK
        script: |
          # Encontrar la carpeta real donde está el proyecto de Android
          REAL_DIR=$(dirname $(find . -name "build.gradle*" | head -n 1))
          cd "$REAL_DIR"
          
          # Verificar si existe gradlew o usar el sistema global
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"

