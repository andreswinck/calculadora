workflows:
  android-apk-build:
    name: Compilar APK Calculadora
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Compilar APK
        script: |
          REAL_GRADLEW=$(find . -name "gradlew" | head -n 1)
          if [ -n "$REAL_GRADLEW" ]; then
            cd "$(dirname "$REAL_GRADLEW")"
            chmod +x gradlew
            ./gradlew assembleDebug --quiet
          else
            REAL_DIR=$(dirname $(find . -name "build.gradle*" | head -n 1))
            cd "$REAL_DIR"
            gradle assembleDebug --quiet
          fi
          
          # Buscamos de forma masiva ignorando mayúsculas/minúsculas
          mkdir -p $CM_BUILD_DIR/output-apk
          find . -iname "*.apk" -exec cp {} $CM_BUILD_DIR/output-apk/ \;
    artifacts:
      - output-apk/*.[aA][pP][kK]
      - "**/build/outputs/apk/**/*.apk"






