workflows:
  android-apk-build:
    name: Compilar APK Calculadora
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Compilar APK
        script: |
          REAL_GRADLEW=$(find . -name "gradlew" | head -n 1)
          if [ -n "$REAL_GRADLEW" ]; then
            cd "$(dirname "$REAL_GRADLEW")"
            chmod +x gradlew
            ./gradlew assembleDebug --quiet
          else
            REAL_DIR=$(dirname $(find . -name "build.gradle*" | head -n 1))
            cd "$REAL_DIR"
            gradle assembleDebug --quiet
          fi
          
          # Imprimimos en la consola todas las rutas para ver dónde se guardó
          echo "--- LISTA DE ARCHIVOS GENERADOS ---"
          find . -name "*.apk" -o -name "*.aab"
          
          # Copiamos cualquier resultado a la carpeta de salida
          mkdir -p $CM_BUILD_DIR/output-apk
          find . -name "*.apk" -exec cp {} $CM_BUILD_DIR/output-apk/ \;
    artifacts:
      - $CM_BUILD_DIR/output-apk/*.apk
      - "app/build/outputs/apk/debug/*.apk"
      - "build/outputs/apk/debug/*.apk"





