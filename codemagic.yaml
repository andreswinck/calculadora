workflows:
  android-apk-build:
    name: Compilar APK Calculadora
    max_build_duration: 15
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Compilar APK
        script: |
          # Buscar de forma agresiva dónde está el archivo gradlew real
          REAL_GRADLEW=$(find . -name "gradlew" | head -n 1)
          
          if [ -n "$REAL_GRADLEW" ]; then
            cd "$(dirname "$REAL_GRADLEW")"
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            # Si no hay gradlew local, buscar el build.gradle y usar el sistema global
            REAL_DIR=$(dirname $(find . -name "build.gradle*" | head -n 1))
            cd "$REAL_DIR"
            gradle :app:assembleDebug --stacktrace
          fi
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"


